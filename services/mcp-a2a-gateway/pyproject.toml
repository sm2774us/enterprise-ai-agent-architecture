[project]
name = "mcp-a2a-gateway"
version = "0.1.0"
description = "MCP (Model Context Protocol) tool-server and A2A (Agent2Agent) interop gateway (ServiceNow Staff AI Engineer showcase)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.6.9", "mypy>=1.11.2"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["UP042"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
