apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  labels:
    app: llm-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llm-gateway
  template:
    metadata:
      labels:
        app: llm-gateway
    spec:
      containers:
        - name: llm-gateway
          image: servicenow-showcase/llm-gateway:latest
          ports:
            - containerPort: 8003
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8003
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: llm-gateway
spec:
  selector:
    app: llm-gateway
  ports:
    - port: 8003
      targetPort: 8003
