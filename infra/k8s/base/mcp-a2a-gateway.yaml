apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-a2a-gateway
  labels:
    app: mcp-a2a-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mcp-a2a-gateway
  template:
    metadata:
      labels:
        app: mcp-a2a-gateway
    spec:
      containers:
        - name: mcp-a2a-gateway
          image: servicenow-showcase/mcp-a2a-gateway:latest
          ports:
            - containerPort: 8002
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8002
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-a2a-gateway
spec:
  selector:
    app: mcp-a2a-gateway
  ports:
    - port: 8002
      targetPort: 8002
