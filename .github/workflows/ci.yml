name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.5"
      - name: Install pre-commit
        run: pip install pre-commit==3.8.0
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        service:
          - agent-orchestrator
          - control-tower
          - mcp-a2a-gateway
          - llm-gateway
    steps:
      - uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install service
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"
      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        include:
          - service: agent-orchestrator
            port: 8000
          - service: control-tower
            port: 8001
          - service: mcp-a2a-gateway
            port: 8002
          - service: llm-gateway
            port: 8003
    steps:
      - uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.2.2
      - name: Build image (fails the job on any non-zero exit)
        run: docker build -t servicenow-showcase/${{ matrix.service }}:ci services/${{ matrix.service }}
      - name: Container smoke test
        run: |
          docker run -d --name smoke-${{ matrix.service }} -p 0:${{ matrix.port }} servicenow-showcase/${{ matrix.service }}:ci
          sleep 3
          docker logs smoke-${{ matrix.service }}
          docker inspect --format='{{.State.Running}}' smoke-${{ matrix.service }} | grep true
          docker rm -f smoke-${{ matrix.service }}

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9.5"
      - name: terraform fmt -check (repo is committed pre-formatted)
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform fmt -check -recursive
      - name: terraform init (backend-less validate mode)
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false
      - name: terraform validate
        working-directory: infra/terraform/environments/${{ matrix.environment }}
        run: terraform validate

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8410ad0602e1e429cee44a835ae9f77f654a6694 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck + build
        working-directory: frontend
        run: npm run build
